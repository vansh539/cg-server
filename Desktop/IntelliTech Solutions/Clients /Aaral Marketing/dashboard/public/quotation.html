<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>New Quotation — Aaral Marketing</title>
<link rel="icon" href="/assets/aaral-logo-small.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aaral Marketing">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#191048">
<link rel="apple-touch-icon" href="/assets/aaral-icon-180.png">
<link rel="stylesheet" href="/styles.css">
<style>
  .form-card { padding: 1.6rem; }
  label.field-label { display: block; font-size: 0.95rem; color: var(--ink-muted); margin-bottom: 0.35rem; font-weight: 500; }
  .field-group { margin-bottom: 1.1rem; max-width: 420px; }
  #itemsTable input { border: none; width: 100%; font-family: inherit; font-size: 0.95rem; background: transparent; padding: 0; }
  #itemsTable input:focus { outline: none; background: var(--concrete); }
  td.row-amount { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-muted); font-family: 'IBM Plex Mono', monospace; }
  button.add-row { margin-top: 0.8rem; padding: 0.5rem 1rem; font-size: 0.95rem; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; cursor: pointer; }
  button.add-row:hover { background: var(--concrete); }
  .totals { margin-top: 1.2rem; text-align: right; }
  .totals .line { display: flex; justify-content: flex-end; gap: 1rem; padding: 0.25rem 0; font-size: 1.05rem; }
  .totals .grand { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.3rem; color: var(--navy); border-top: 1px solid var(--line); margin-top: 0.4rem; padding-top: 0.5rem; }
  .totals input { width: 110px; text-align: right; padding: 0.3rem 0.5rem; border: 1px solid var(--line); border-radius: 6px; font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>
<script src="/auth-nav.js"></script>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-top">
      <div class="brand-mark">
        <img src="/assets/aaral-logo-header.png" alt="Aaral Marketing">
        <div class="brand-text">
          <h1>Aaral Marketing</h1>
          <p>Cement &amp; Building Materials Ledger</p>
        </div>
      </div>
      <nav class="hero-nav">
        <a href="/">Home</a>
        <a href="/customers.html">Customers</a>
        <a class="active" href="/quotation.html">New Quotation</a>
        <a href="/chitti.html">New Slip</a>
        <a href="/payment.html">New Payment</a>
        <a href="/updates.html" data-admin-only>Updates</a>
        <a href="/users.html" data-admin-only>Users</a>
      </nav>
    </div>
    <div class="hero-heading">
      <div class="eyebrow">Document generator</div>
      <h2>New Quotation</h2>
    </div>
  </div>
  <svg class="hero-wave" viewBox="0 0 1440 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,50 C240,90 480,10 720,50 C960,90 1200,10 1440,50 L1440,100 L0,100 Z" fill="#00aeef" opacity="0.22"/>
    <path d="M0,65 C240,35 480,95 720,65 C960,35 1200,95 1440,65 L1440,100 L0,100 Z" fill="#7fd8f7" opacity="0.3"/>
    <path d="M0,80 C240,60 480,100 720,80 C960,60 1200,100 1440,80 L1440,100 L0,100 Z" fill="#ece7dc" opacity="1"/>
  </svg>
</div>

<div class="page">
  <a class="back-link" href="/customers.html">&larr; All customers</a>

  <div class="card form-card">
    <div class="field-group">
      <label class="field-label">To (recipient name — optional)</label>
      <input type="text" id="recipientName" placeholder="e.g. Konark Construction Co">
    </div>

    <div class="field-group">
      <label class="field-label">Address (optional)</label>
      <input type="text" id="recipientAddress" placeholder="e.g. Site address / delivery location">
    </div>

    <div class="field-group">
      <label class="field-label">Mobile number (optional)</label>
      <input type="text" id="recipientMobile" placeholder="10-digit mobile number">
    </div>

    <div class="table-scroll">
      <table id="itemsTable">
        <thead>
          <tr><th>S No.</th><th>Particulars</th><th>Grade</th><th>Vch</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <button class="add-row" id="addRow" type="button">+ Add line</button>

    <div class="totals">
      <div class="line"><span>Subtotal</span><span>₹<span id="subtotal">0.00</span></span></div>
      <div class="line"><span>Unloading charges</span><span>₹<input id="unloading" type="number" min="0" step="0.01"></span></div>
      <div class="line grand"><span>Total</span><span>₹<span id="grandTotal">0.00</span></span></div>
    </div>

    <div style="margin-top:1.4rem; display:flex; gap:0.7rem; flex-wrap:wrap;">
      <button class="btn-primary" id="generateBtn" type="button">Generate Quotation PDF</button>
      <button class="btn-primary" id="sendWhatsappBtn" type="button">Send via WhatsApp</button>
    </div>
    <div id="status" style="margin-top:0.6rem;font-size:0.9rem;"></div>
  </div>
</div>

<footer class="footer-credit">Powered by IntelliTech Solutions</footer>

<script>
const tbody = document.querySelector('#itemsTable tbody');

function addRow() {
  const tr = document.createElement('tr');
  const sNo = tbody.children.length + 1;
  tr.innerHTML = `
    <td>${sNo}</td>
    <td><input class="particulars"></td>
    <td><input class="grade"></td>
    <td><input class="vch"></td>
    <td><input class="qty num" type="number" min="0" step="0.01"></td>
    <td><input class="rate num" type="number" min="0" step="0.01"></td>
    <td class="row-amount num">0.00</td>`;
  tbody.appendChild(tr);
  tr.querySelectorAll('.qty, .rate').forEach((el) => el.addEventListener('input', recalc));
}

function recalc() {
  let subtotal = 0;
  tbody.querySelectorAll('tr').forEach((tr) => {
    const qty = Number(tr.querySelector('.qty').value) || 0;
    const rate = Number(tr.querySelector('.rate').value) || 0;
    const amount = qty * rate;
    tr.querySelector('.row-amount').textContent = amount.toFixed(2);
    subtotal += amount;
  });
  const unloading = Number(document.getElementById('unloading').value) || 0;
  document.getElementById('subtotal').textContent = subtotal.toFixed(2);
  document.getElementById('grandTotal').textContent = (subtotal + unloading).toFixed(2);
}

document.getElementById('unloading').addEventListener('input', recalc);
document.getElementById('addRow').addEventListener('click', addRow);
addRow();

function buildQuotationBody() {
  const items = [...tbody.querySelectorAll('tr')].map((tr) => ({
    particulars: tr.querySelector('.particulars').value,
    grade: tr.querySelector('.grade').value,
    vch: tr.querySelector('.vch').value,
    qty: tr.querySelector('.qty').value,
    rate: tr.querySelector('.rate').value,
  }));
  return {
    recipientName: document.getElementById('recipientName').value || null,
    recipientAddress: document.getElementById('recipientAddress').value || null,
    recipientMobile: document.getElementById('recipientMobile').value || null,
    items,
    unloadingCharge: document.getElementById('unloading').value || null,
  };
}

document.getElementById('generateBtn').addEventListener('click', async () => {
  const body = buildQuotationBody();
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  statusEl.textContent = 'Generating…';
  statusEl.style.color = 'var(--ink-muted)';
  try {
    const res = await fetch('/api/quotations/pdf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || 'Failed to generate PDF');
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Aaral-Marketing-Quotation.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    statusEl.textContent = 'Quotation PDF downloaded.';
    statusEl.style.color = 'var(--moss)';
  } catch (err) {
    statusEl.textContent = `Error: ${err.message}`;
    statusEl.style.color = 'var(--rust)';
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('sendWhatsappBtn').addEventListener('click', async () => {
  const body = buildQuotationBody();
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('sendWhatsappBtn');
  if (!body.recipientMobile) {
    statusEl.textContent = 'Enter a mobile number to send via WhatsApp.';
    statusEl.style.color = 'var(--rust)';
    return;
  }
  btn.disabled = true;
  statusEl.textContent = 'Sending…';
  statusEl.style.color = 'var(--ink-muted)';
  try {
    const res = await fetch('/api/quotations/send-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Failed to send');
    statusEl.textContent = `Quotation sent to ${body.recipientMobile} via WhatsApp.`;
    statusEl.style.color = 'var(--moss)';
  } catch (err) {
    statusEl.textContent = `Error: ${err.message}`;
    statusEl.style.color = 'var(--rust)';
  } finally {
    btn.disabled = false;
  }
});
</script>
<script>
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
