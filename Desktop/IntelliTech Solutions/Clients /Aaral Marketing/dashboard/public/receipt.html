  .receipt-amount { font-family: 'Space Grotesk', sans-serif; font-size: 3rem; font-weight: 800; color: var(--navy); margin: 0.4rem 0 1.2rem; }
  .receipt-meta { display: flex; justify-content: center; gap: 2.5rem; padding-top: 1.2rem; border-top: 1px solid var(--line); }
  .receipt-meta .item { text-align: center; }
  .receipt-meta .item .label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted); }
  .receipt-meta .item .value { font-size: 1rem; font-weight: 600; color: var(--ink); margin-top: 0.2rem; }
  @media print {
    .sidebar, .no-print { display: none !important; }
    body { background: #fff; }
    .content-inner { padding: 0; }
    .receipt-card { box-shadow: none; border: 1px solid #000; }
  }
</style>

      <a class="back-link no-print" href="/customers.html" id="backLink">&larr; All customers</a>

      <div class="topbar no-print" style="margin-bottom:14px;">
        <div>
          <div class="page-eyebrow">Payment receipt</div>
          <h1 class="page-title" id="receiptTitle">Loading…</h1>
        </div>
      </div>

      <div class="card receipt-card">
        <div class="receipt-label">Amount received</div>
        <div class="receipt-amount" id="receiptAmount">—</div>
        <div class="receipt-meta">
          <div class="item">
            <div class="label">Date</div>
            <div class="value" id="receiptDate">—</div>
          </div>
          <div class="item">
            <div class="label">Mode</div>
            <div class="value" id="receiptMode">—</div>
          </div>
          <div class="item">
            <div class="label">Balance after</div>
            <div class="value" id="receiptBalance">—</div>
          </div>
        </div>
      </div>

      <div class="no-print" style="text-align:center; margin-top:1.4rem;">
        <button class="btn-primary" onclick="window.print()">Print</button>
        <button class="btn-ghost" id="sendWhatsappBtn" type="button" style="margin-left:0.6rem;">Send PDF to Customer on WhatsApp</button>
        <div id="sendStatus" style="margin-top:0.8rem; font-size:0.85rem;"></div>
      </div>
    </div>
  </main>
</div>

<script>
const METHOD_LABELS = { cash: 'Cash', gpay: 'GPay', bank_transfer: 'Bank Transfer' };
const params = new URLSearchParams(window.location.search);
const paymentId = params.get('id');

async function load() {
  const res = await fetch(`/api/payments/${paymentId}`);
  if (!res.ok) {
    document.getElementById('receiptTitle').textContent = 'Payment not found';
    return;
  }
  const { payment, balance } = await res.json();
  document.getElementById('receiptTitle').textContent = payment.customer_name;
  document.getElementById('receiptAmount').textContent = `₹${Number(payment.amount_claimed).toLocaleString('en-IN')}`;
  document.getElementById('receiptDate').textContent = new Date(payment.reported_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  document.getElementById('receiptMode').textContent = METHOD_LABELS[payment.proof_type] || payment.proof_type;
  document.getElementById('receiptBalance').textContent = balance !== null ? `₹${Number(balance).toLocaleString('en-IN')}` : '—';
  document.getElementById('backLink').href = `/customer.html?id=${payment.customer_id}`;
  document.getElementById('backLink').innerHTML = '&larr; Back to ledger';
}

load();

const sendWhatsappBtn = document.getElementById('sendWhatsappBtn');
const sendStatus = document.getElementById('sendStatus');
sendWhatsappBtn.addEventListener('click', async () => {
  sendWhatsappBtn.disabled = true;
  sendStatus.textContent = 'Sending PDF on WhatsApp…';
  sendStatus.style.color = 'var(--ink-muted)';
  const res = await fetch(`/api/payments/${paymentId}/send-whatsapp`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({}),
  });
  const data = await res.json().catch(() => ({ ok: false, error: 'Unexpected response from server' }));
  sendWhatsappBtn.disabled = false;
  if (!data.ok) {
    sendStatus.textContent = `Could not send on WhatsApp: ${data.error}`;
    sendStatus.style.color = 'var(--rust)';
    return;
  }
  sendStatus.textContent = 'Sent to the customer on WhatsApp.';
  sendStatus.style.color = 'var(--moss)';
});
</script>
<script>
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
