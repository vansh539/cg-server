<head>
<meta charset="utf-8">

<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aaral Marketing">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#191048">

<link rel="stylesheet" href="/styles.css">
<style>
  .form-card { padding: 1.6rem; }
  .form-card label { display: block; font-size: 0.95rem; color: var(--ink-muted); font-weight: 500; margin-bottom: 0.35rem; }
  .field-group { margin-bottom: 1.1rem; max-width: 360px; }

  #customerSearchWrap { position: relative; max-width: 360px; }
  #customerResults { border: 1px solid var(--line); border-radius: 8px; margin-top: 0.3rem; max-height: 200px; overflow-y: auto; display: none; background: var(--paper); box-shadow: var(--shadow); position: absolute; width: 100%; z-index: 5; }
  #customerResults div { padding: 0.6rem 0.8rem; cursor: pointer; font-size: 0.88rem; }
  #customerResults div:hover { background: var(--concrete); }
  #customerResults div.create-new { color: var(--cyan); font-weight: 600; border-top: 1px solid var(--line); }
  #selectedCustomer { margin-top: 0.5rem; font-size: 0.85rem; color: var(--ink-muted); }

  .method-row { display: flex; gap: 0.6rem; margin-bottom: 1.1rem; }
  .method-btn {
    flex: 1; padding: 0.7rem 0.5rem; border: 1px solid var(--line); border-radius: 10px;
    background: var(--paper); cursor: pointer; text-align: center; font-weight: 600; font-size: 0.88rem;
    color: var(--ink-muted); transition: all 0.15s ease;
  }
  .method-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }

  .toggle-row { display: flex; align-items: center; gap: 0.6rem; margin-top: 1rem; font-size: 1.05rem; color: var(--ink); }
  .toggle-row input { width: 1.25em; height: 1.25em; cursor: pointer; }
  .toggle-row label { font-size: 1.05rem; cursor: pointer; }
</style>
</head>
<body>

      </div>
    </a>

    <a class="nav-item" href="/dashboard.html">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 10 4l7 6.5"/><path d="M5 9v7a1 1 0 0 0 1 1h3v-5h2v5h3a1 1 0 0 0 1-1V9"/></svg>

    <a class="nav-item" href="/customers.html">

      <span>Customers</span>
    </a>
    <a class="nav-item" href="/quotation.html">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h6l3 3V17a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1Z"/><path d="M12 2.5V6h3"/><path d="M7 10h6M7 13h6M7 7h3"/></svg>
      <span>New Quotation</span>
    </a>
    <a class="nav-item" href="/chitti.html">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5h10v15l-1.5-1-1.5 1-1.5-1-1.5 1-1.5-1-1.5 1-1.5-1z"/><path d="M7.5 6.5h5M7.5 9.5h5M7.5 12.5h3"/></svg>
      <span>New Slip</span>
    </a>
    <a class="nav-item active" href="/payment.html">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="15" height="10.5" rx="2"/><path d="M2.5 8.5h15"/><circle cx="14.5" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
      <span>New Payment</span>
    </a>

    <div class="nav-divider"></div>
    <div class="nav-section-label">Iron &amp; Steel</div>
    <a class="nav-item" href="/steel-chitti.html">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5h10v15l-1.5-1-1.5 1-1.5-1-1.5 1-1.5-1-1.5 1-1.5-1z"/><path d="M7.5 6.5h5M7.5 9.5h5M7.5 12.5h3"/></svg>
      <span>Steel Chitti</span>
    </a>
    <a class="nav-item" href="/steel-stock.html">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5 17 6.2v7.6L10 17.5 3 13.8V6.2z"/><path d="M3 6.2 10 10l7-3.8M10 10v7.5"/></svg>
      <span>Steel Stock</span>
    </a>
    <a class="nav-item" href="/steel-reports.html">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 17V9M9.5 17V3M15.5 17v-6"/><path d="M2.5 17h15"/></svg>
      <span>Steel Reports</span>
    </a>

    <div class="nav-divider" data-admin-only></div>
    <div class="nav-section-label" data-admin-only>Admin</div>
    <a class="nav-item" href="/updates.html" data-admin-only>
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a6 6 0 0 1 10.2-4.3M16 10a6 6 0 0 1-10.2 4.3"/><path d="M14.2 5.7H17V3"/><path d="M5.8 14.3H3V17"/></svg>
      <span>Updates</span>
    </a>
    <a class="nav-item" href="/users.html" data-admin-only>
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5 16 5v5c0 4-2.7 6.5-6 7.5-3.3-1-6-3.5-6-7.5V5z"/><path d="M7.3 9.8l1.9 1.9 3.5-3.9"/></svg>
      <span>Users</span>
    </a>
    <a class="nav-item" href="/personnel-tracking.html" data-admin-only>
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h7a1 1 0 0 1 1 1V16a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"/><path d="M7.5 3h5v1.6h-5z"/><path d="M7 8h6M7 11h6M7 14h3.5"/></svg>
      <span>Personnel Tracking</span>

      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5v10.5M6.5 9.5 10 13l3.5-3.5"/><path d="M4 13.5v2A1.5 1.5 0 0 0 5.5 17h9a1.5 1.5 0 0 0 1.5-1.5v-2"/></svg>
      <span>Backup</span>

    <div class="profile-card" id="profileCard" style="display:none;">
      <div class="profile-avatar" id="profileAvatar">--</div>
      <div class="profile-meta">
        <div class="profile-name" id="profileName">—</div>
        <div class="profile-role" id="profileRole">—</div>
      </div>
      <button class="profile-logout" id="navLogoutBtn" type="button" title="Log out">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h4"/><path d="M13 14l4-4-4-4"/><path d="M17 10H7"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="content-inner">
      <a class="back-link" href="/customers.html">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15l-5-5 5-5"/></svg>
        All customers
      </a>

      <div class="topbar" style="margin-bottom:14px;">
        <div>
          <div class="page-eyebrow">Manual ledger update</div>
          <h1 class="page-title">New Payment</h1>
        </div>
      </div>

      <div class="card form-card">
        <div class="field-group" id="customerSearchWrap">
          <label>Customer</label>
          <input type="text" id="customerSearch" placeholder="Search by name or phone…" autocomplete="off">
          <div id="customerResults"></div>
        </div>
        <div id="selectedCustomer"></div>

        <div class="field-group" id="newPhoneGroup" style="display:none;">
          <label>Phone number (new customer, optional)</label>
          <input type="text" id="newCustomerPhone" placeholder="10-digit WhatsApp number" autocomplete="off">
        </div>

        <div class="field-group">
          <label>Date</label>
          <input type="date" id="paymentDate">
        </div>

        <div class="field-group">
          <label>Amount received</label>
          <input type="number" id="amount" min="0" step="0.01" placeholder="0.00">
        </div>

        <div class="field-group">
          <label>Mode of payment</label>
          <div class="method-row">
            <div class="method-btn active" data-method="cash">Cash</div>
            <div class="method-btn" data-method="gpay">GPay</div>
            <div class="method-btn" data-method="bank_transfer">Bank</div>
          </div>
        </div>

        <div class="toggle-row">
          <input type="checkbox" id="sendWhatsapp" disabled>
          <label for="sendWhatsapp">Send payment slip to customer via WhatsApp</label>
        </div>

        <button id="save" class="btn-primary" type="button" style="margin-top:1.4rem;">Record Payment</button>
        <div id="status" style="margin-top:0.6rem;font-size:0.9rem;"></div>
      </div>
    </div>
  </main>
</div>

<script>
let selectedCustomerId = null;
let selectedMethod = 'cash';

document.getElementById('paymentDate').value = new Date().toLocaleDateString('en-CA');

document.querySelectorAll('.method-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.method-btn').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    selectedMethod = btn.dataset.method;
  });
});

const searchInput = document.getElementById('customerSearch');
const resultsBox = document.getElementById('customerResults');
const sendWhatsappCheckbox = document.getElementById('sendWhatsapp');
const newPhoneGroup = document.getElementById('newPhoneGroup');
const selectedCustomerEl = document.getElementById('selectedCustomer');
let searchTimer = null;
let pendingNewName = null;

function clearSelection() {
  selectedCustomerId = null;
  pendingNewName = null;
  sendWhatsappCheckbox.checked = false;
  sendWhatsappCheckbox.disabled = true;
  newPhoneGroup.style.display = 'none';
  selectedCustomerEl.textContent = '';
}

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  clearSelection();
  const term = searchInput.value.trim();
  if (!term) { resultsBox.style.display = 'none'; return; }
  searchTimer = setTimeout(async () => {
    const res = await fetch(`/api/customers?q=${encodeURIComponent(term)}`);
    const matches = await res.json();
    resultsBox.innerHTML = '';
    matches.forEach((c) => {
      const div = document.createElement('div');
      div.textContent = `${c.name} — ${c.phone_number} (Balance: ₹${c.balance})`;
      div.addEventListener('click', () => {
        selectedCustomerId = c.customer_id;
        pendingNewName = null;
        selectedCustomerEl.textContent = `Selected: ${c.name} (₹${c.balance} balance)`;
        resultsBox.style.display = 'none';
        searchInput.value = c.name;
        newPhoneGroup.style.display = 'none';
        sendWhatsappCheckbox.disabled = false;
      });
      resultsBox.appendChild(div);
    });
    const createDiv = document.createElement('div');
    createDiv.className = 'create-new';
    createDiv.textContent = `+ Create new customer "${term}"`;
    createDiv.addEventListener('click', () => {
      selectedCustomerId = null;
      pendingNewName = term;
      selectedCustomerEl.textContent = `New customer: ${term}`;
      resultsBox.style.display = 'none';
      newPhoneGroup.style.display = '';
      sendWhatsappCheckbox.disabled = false;
    });
    resultsBox.appendChild(createDiv);
    resultsBox.style.display = 'block';
  }, 250);
});

document.getElementById('save').addEventListener('click', async () => {
  const statusEl = document.getElementById('status');
  const amount = document.getElementById('amount').value;
  const newPhone = document.getElementById('newCustomerPhone').value.trim();

  if (!selectedCustomerId && !pendingNewName) {
    statusEl.textContent = 'Select an existing customer or create a new one.';
    statusEl.style.color = 'var(--rust)';
    return;
  }
  if (!amount || Number(amount) <= 0) {
    statusEl.textContent = 'Enter a valid amount.';
    statusEl.style.color = 'var(--rust)';
    return;
  }

  const body = {
    customerId: selectedCustomerId,
    newCustomerName: pendingNewName || undefined,
    newCustomerPhone: pendingNewName ? newPhone : undefined,
    amount,
    method: selectedMethod,
    date: document.getElementById('paymentDate').value || null,
    sendWhatsapp: sendWhatsappCheckbox.checked,
  };

  const res = await fetch('/api/payments', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!data.ok) {
    statusEl.textContent = `Error: ${data.error}`;
    statusEl.style.color = 'var(--rust)';
    return;
  }
  window.location.href = `/receipt.html?id=${data.paymentId}`;
});
</script>
<script>
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
