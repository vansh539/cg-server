  /* The slip is sized in vw by src/chittiStyles.js so it fills whatever paper
     it lands on. On screen that made it size against the whole window while
     sitting in a 620px box -- ~3x too big, so the columns crammed. Giving it
     its own viewport (an iframe) makes vw resolve against the slip's own
     width, which is what the design always meant. Printing still uses the
     real page, via #printHost below, exactly like chitti.html. */
  .chitti-frame { display: flex; justify-content: center; padding: 0.5rem 0 1.5rem; }
  #chittiFrame {
    width: 100%;
    max-width: 880px;
    border: 0;
    display: block;
    /* Replaced by the measured content height once the slip has laid out. */
    height: 320px;
  }
  #printHost { display: none; }
  @media print {
    body > *:not(#printHost) { display: none !important; }
    #printHost { display: block !important; }
  }

<!-- Printing renders the very same server fragment as the preview, so there is
     still exactly one chitti design in play. -->
<div id="printHost"></div>

<script>
const params = new URLSearchParams(window.location.search);
const invoiceId = params.get('id');

async function load() {
  const res = await fetch(`/api/invoices/${invoiceId}`);
  if (!res.ok) {
    document.getElementById('invoiceTitle').textContent = 'Invoice not found';
    return;
  }
  const { invoice, items } = await res.json();

  document.getElementById('invoiceTitle').textContent = `Invoice #${invoice.invoice_number}`;
  const date = new Date(invoice.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  document.getElementById('invoiceMeta').textContent = date;
  document.getElementById('invoiceTotal').textContent = `₹${Number(invoice.total).toLocaleString('en-IN')}`;
  // A voided invoice can't be edited (same rule the customer ledger's row
  // actions already enforce) -- surfaced here too, since this page never
  // showed voided status at all before.
  if (invoice.voided_at) {
    document.getElementById('invoiceStatus').textContent = 'Voided';
    document.getElementById('invoiceStatus').style.color = 'var(--rust)';
  } else {
    document.getElementById('invoiceStatus').textContent = invoice.paid_now ? 'Paid' : 'On account';
    const editBtn = document.getElementById('editBtn');
    editBtn.href = `/edit-invoice.html?id=${invoiceId}`;
    editBtn.style.display = '';
  }
  if (invoice.destination) {
    document.getElementById('destinationTile').style.display = '';
    document.getElementById('invoiceDestination').textContent = invoice.destination;
  }

  if (invoice.customer_id) {
    document.getElementById('backLink').href = `/customer.html?id=${invoice.customer_id}`;
    document.getElementById('backLink').innerHTML = '&larr; Back to ledger';
  }

  // Ask the server for the slip rather than rebuilding it here. Every value in
  // the fragment is escaped by src/chittiTemplate.js before it is sent.
  const slipRes = await fetch(`/api/invoices/${invoiceId}/chitti`);
  const frame = document.getElementById('chittiFrame');
  if (!slipRes.ok) {
    frame.replaceWith(Object.assign(document.createElement('p'), {
      textContent: 'Could not load the slip.',
    }));
    return;
  }
  const slip = await slipRes.json();

  // The print copy lives in the page itself -- an iframe is not reliably
  // paginated by the browser's print path, and print needs the paper as its
  // viewport anyway. Same HTML string, so both stay one design.
  document.getElementById('printHost').innerHTML = slip.html;
  renderPreview(slip.html);
}

// The slip gets its own document so that its vw units resolve against the
// preview width instead of the browser window. Hairline borders stay at their
// true px widths, which is why this is not just a transform: scale().
function renderPreview(html) {
  const frame = document.getElementById('chittiFrame');
  const doc = frame.contentDocument;
  doc.open();
  doc.write(
    '<!doctype html><html><head><meta charset="utf-8">' +
    '<link rel="stylesheet" href="/chitti-print.css">' +
    '<style>html,body{margin:0;padding:0;background:#fff;}</style>' +
    '</head><body>' + html + '</body></html>'
  );
  doc.close();

  // ResizeObserver, not the iframe's 'load' event: 'load' fired before the
  // stylesheet had actually finished applying, measuring the slip at
  // roughly half its real height every time -- reproduced live, not
  // theoretical. Observing the slip's own <html> re-measures whenever its
  // rendered size actually changes, which self-corrects once the real
  // layout settles and also covers the width shrinking/growing when the
  // window resizes (vw units make a narrower slip taller).
  const ro = new ResizeObserver(() => {
    const h = frame.contentDocument.documentElement.scrollHeight;
    if (h > 0) frame.style.height = h + 'px';
  });
  ro.observe(frame.contentDocument.documentElement);
}

load();

document.getElementById('printBtn').addEventListener('click', () => window.print());
document.getElementById('downloadPdfBtn').addEventListener('click', () => {
  window.location.href = `/api/invoices/${invoiceId}/pdf`;
});
</script>
<script>
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
