<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Invoice — Aaral Marketing</title>
<link rel="icon" href="/assets/aaral-logo-small.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aaral Marketing">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#191048">
<link rel="apple-touch-icon" href="/assets/aaral-icon-180.png">
<link rel="stylesheet" href="/styles.css">
<style>
  .toolbar-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.6rem; }
  .toolbar-row .actions { display: flex; gap: 0.6rem; }

  #itemsTable { table-layout: fixed; }
  col.c-sl { width: 5%; }
  col.c-particulars { width: 27%; }
  col.c-grade { width: 12%; }
  col.c-vch { width: 10%; }
  col.c-qty { width: 12%; }
  col.c-rate { width: 13%; }
  col.c-amount { width: 21%; }

  .only-print { display: none; }

  @media print {
    .hero, .no-print { display: none !important; }
    body { background: #fff; }
    body::before { display: none; }
    .page { padding: 0; max-width: none; margin: 0; }
    .card { background: none; box-shadow: none; border: none; border-radius: 0; padding: 0; }

    #itemsTable { border-collapse: collapse; border: 2px solid #000; }
    #itemsTable th, #itemsTable td { border: 1px solid #000; padding: 0.5rem 0.65rem; font-size: 1.05rem; }
    #itemsTable thead tr.col-headers th { text-transform: none; font-weight: 700; background: #fff; font-size: 0.95rem; }
    #itemsTable tbody td { font-weight: 600; font-size: 1.05rem; }
    #itemsTable .only-print { display: table-row; }

    #itemsTable thead tr.print-title-row th { background: #ffe600; text-align: center; font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 1.7rem; text-transform: uppercase; padding: 0.7rem; letter-spacing: 0.02em; }
    #itemsTable thead tr.print-date-row th, #itemsTable thead tr.print-destination-row th { background: #fff; text-align: left; font-weight: 500; font-size: 1.15rem; text-transform: none; padding: 0.55rem 0.8rem; }
    #itemsTable thead tr.print-date-row .print-date-value, #itemsTable thead tr.print-destination-row .print-date-value { font-weight: 800; font-size: 1.25rem; float: right; }

    #itemsTable tr.total-row td { font-weight: 800; font-size: 1.35rem; border-top: 2px solid #000; }
    .footer-total-label { text-align: right; }
  }
</style>
</head>
<body>
<script src="/auth-nav.js"></script>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-top">
      <div class="brand-mark">
        <img src="/assets/aaral-logo-header.png" alt="Aaral Marketing">
        <div class="brand-text">
          <h1>Aaral Marketing</h1>
          <p>Cement &amp; Building Materials Ledger</p>
        </div>
      </div>
      <nav class="hero-nav">
        <a href="/">Home</a>
        <a href="/customers.html">Customers</a>
        <a href="/quotation.html">New Quotation</a>
        <a href="/chitti.html">New Slip</a>
        <a href="/payment.html">New Payment</a>
        <a href="/updates.html" data-admin-only>Updates</a>
        <a href="/users.html" data-admin-only>Users</a>
      </nav>
    </div>
    <div class="hero-heading">
      <div class="eyebrow" id="invoiceMeta">Invoice</div>
      <h2 id="invoiceTitle">Loading…</h2>
    </div>
    <div class="stat-row">
      <div class="stat-tile">
        <div class="label">Total</div>
        <div class="value" id="invoiceTotal">—</div>
      </div>
      <div class="stat-tile">
        <div class="label">Status</div>
        <div class="value" id="invoiceStatus" style="font-size:1rem;">—</div>
      </div>
      <div class="stat-tile" id="destinationTile" style="display:none;">
        <div class="label">Destination</div>
        <div class="value" id="invoiceDestination" style="font-size:1rem;">—</div>
      </div>
    </div>
  </div>
  <svg class="hero-wave" viewBox="0 0 1440 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,50 C240,90 480,10 720,50 C960,90 1200,10 1440,50 L1440,100 L0,100 Z" fill="#00aeef" opacity="0.22"/>
    <path d="M0,65 C240,35 480,95 720,65 C960,35 1200,95 1440,65 L1440,100 L0,100 Z" fill="#7fd8f7" opacity="0.3"/>
    <path d="M0,80 C240,60 480,100 720,80 C960,60 1200,100 1440,80 L1440,100 L0,100 Z" fill="#ece7dc" opacity="1"/>
  </svg>
</div>

<div class="page">
  <div class="toolbar-row no-print">
    <a class="back-link" href="/customers.html" id="backLink" style="margin:0;">&larr; All customers</a>
    <div class="actions">
      <button class="btn-primary" id="printBtn" type="button">Print</button>
      <button class="btn-primary" id="downloadPdfBtn" type="button">Download PDF</button>
    </div>
  </div>

  <div class="card">
    <div class="table-scroll">
      <table id="itemsTable">
        <colgroup>
          <col class="c-sl"><col class="c-particulars"><col class="c-grade"><col class="c-vch">
          <col class="c-qty"><col class="c-rate"><col class="c-amount">
        </colgroup>
        <thead>
          <tr class="only-print print-title-row"><th colspan="7" id="printCustomerName"></th></tr>
          <tr class="only-print print-date-row"><th colspan="7"><span>Date:</span> <span class="print-date-value" id="printDateValue"></span></th></tr>
          <tr class="only-print print-destination-row" id="printDestinationRow"><th colspan="7"><span>Destination:</span> <span class="print-date-value" id="printDestinationValue"></span></th></tr>
          <tr class="col-headers"><th>S No.</th><th>Particulars</th><th>Grade</th><th>Vch</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<footer class="footer-credit no-print">Powered by IntelliTech Solutions</footer>

<script>
const params = new URLSearchParams(window.location.search);
const invoiceId = params.get('id');

async function load() {
  const res = await fetch(`/api/invoices/${invoiceId}`);
  if (!res.ok) {
    document.getElementById('invoiceTitle').textContent = 'Invoice not found';
    return;
  }
  const { invoice, items } = await res.json();

  document.getElementById('invoiceTitle').textContent = `Invoice #${invoice.invoice_number}`;
  const date = new Date(invoice.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  document.getElementById('invoiceMeta').textContent = date;
  document.getElementById('invoiceTotal').textContent = `₹${Number(invoice.total).toLocaleString('en-IN')}`;
  document.getElementById('invoiceStatus').textContent = invoice.paid_now ? 'Paid' : 'On account';
  if (invoice.destination) {
    document.getElementById('destinationTile').style.display = '';
    document.getElementById('invoiceDestination').textContent = invoice.destination;
  }

  const createdDate = new Date(invoice.created_at);
  const printDate = [createdDate.getDate(), createdDate.getMonth() + 1, createdDate.getFullYear()]
    .map((n, i) => (i < 2 ? String(n).padStart(2, '0') : n)).join('-');

  document.getElementById('printCustomerName').textContent = invoice.customer_name || 'WALK-IN / CASH SALE';
  document.getElementById('printDateValue').textContent = printDate;
  document.getElementById('printDestinationValue').textContent = invoice.destination || '';
  document.getElementById('printDestinationRow').style.display = invoice.destination ? '' : 'none';

  if (invoice.customer_id) {
    document.getElementById('backLink').href = `/customer.html?id=${invoice.customer_id}`;
    document.getElementById('backLink').innerHTML = '&larr; Back to ledger';
  }

  const rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = '';
  items.forEach((item) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${item.s_no}</td><td>${item.particulars}</td><td>${item.grade || ''}</td><td>${item.vch || ''}</td><td class="num">${Number(item.qty)}</td><td class="num">₹${Number(item.rate).toFixed(2)}</td><td class="num">₹${Number(item.amount).toFixed(2)}</td>`;
    rowsEl.appendChild(tr);
  });
  if (invoice.unloading_charge) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td></td><td colspan="4">Unloading charges</td><td></td><td class="num">₹${Number(invoice.unloading_charge).toFixed(2)}</td>`;
    rowsEl.appendChild(tr);
  }
  const totalTr = document.createElement('tr');
  totalTr.className = 'total-row';
  totalTr.innerHTML = `<td></td><td colspan="4" class="footer-total-label" style="font-weight:700;">Total</td><td></td><td class="num" style="font-weight:700;font-size:1.1rem;">₹${Number(invoice.total).toFixed(2)}</td>`;
  rowsEl.appendChild(totalTr);
}

load();

document.getElementById('printBtn').addEventListener('click', () => window.print());
document.getElementById('downloadPdfBtn').addEventListener('click', () => {
  window.location.href = `/api/invoices/${invoiceId}/pdf`;
});
</script>
<script>
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
