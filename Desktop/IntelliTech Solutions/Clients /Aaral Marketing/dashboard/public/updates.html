<script>
const statusEl = document.getElementById('updatesStatus');
const checkBtn = document.getElementById('checkBtn');
const applyBtn = document.getElementById('applyBtn');
let pollTimer = null;

async function check() {
  statusEl.className = 'updates-status';
  statusEl.textContent = 'Checking…';
  applyBtn.style.display = 'none';
  try {
    const res = await fetch('/api/updates/check');
    const data = await res.json();
    if (res.status === 403) {
      statusEl.className = 'updates-status err';
      statusEl.textContent = "You don't have access to this — Updates is admin-only.";
      checkBtn.style.display = 'none';
      return;
    }
    if (data.updateAvailable) {
      statusEl.textContent = `Update available: v${data.latestVersion} (${data.commitsBehind} change${data.commitsBehind === 1 ? '' : 's'} behind current v${data.currentVersion}).`;
      applyBtn.style.display = 'inline-block';
    } else {
      statusEl.className = 'updates-status ok';
      statusEl.textContent = `Up to date (v${data.currentVersion}).`;
    }
  } catch (err) {
    statusEl.className = 'updates-status err';
    statusEl.textContent = 'Could not reach the update service.';
  }
}

checkBtn.addEventListener('click', check);
applyBtn.addEventListener('click', async () => {
  if (!confirm('Update the app now? This restarts the dashboard and WhatsApp bridge for a couple of minutes.')) return;
  await fetch('/api/updates/apply', { method: 'POST' });
  applyBtn.style.display = 'none';
  statusEl.className = 'updates-status';
  statusEl.textContent = 'Update started — this can take a couple of minutes. Do not close this page.';
  pollTimer = setInterval(poll, 3000);
});

async function poll() {
  const res = await fetch('/api/updates/status');
  const data = await res.json();
  if (data.state === 'running') return;
  clearInterval(pollTimer);
  if (data.state === 'succeeded') {
    statusEl.className = 'updates-status ok';
    statusEl.textContent = `Updated successfully to v${data.result.newCommit.slice(0, 7)}.`;
  } else if (data.state === 'failed') {
    statusEl.className = 'updates-status err';
    if (data.result.notStarted) {
      statusEl.textContent = `Update could not start (${data.result.reason}) — nothing was changed, the site is unaffected.`;
    } else if (data.result.rolledBack) {
      statusEl.textContent = `Update failed and was rolled back safely (${data.result.reason}).`;
    } else {
      statusEl.textContent = `Update failed and rollback also failed (${data.result.rollbackError || data.result.reason || 'unknown error'}) — this needs Vansh to remote in.`;
    }
  }
}

check();
</script>
<script>
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
