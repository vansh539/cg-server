<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Edit Invoice — Aaral Marketing</title>
<link rel="icon" href="/assets/aaral-logo-small.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aaral Marketing">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#191048">
<link rel="apple-touch-icon" href="/assets/aaral-icon-180.png">
<link rel="stylesheet" href="/styles.css">
<style>
  .form-card { padding: 1.6rem; }
  .form-card label { display: block; font-size: 0.95rem; color: var(--ink-muted); font-weight: 500; margin-bottom: 0.35rem; }
  .field-group { margin-bottom: 1.1rem; max-width: 260px; }

  #itemsTable { width: 100%; border-collapse: collapse; margin-top: 0.4rem; table-layout: fixed; }
  #itemsTable th, #itemsTable td { border: 1px solid #000; padding: 0.5rem; font-size: 0.85rem; text-align: left; overflow: hidden; }
  #itemsTable th { background: #eee; text-transform: uppercase; font-size: 0.72rem; }
  #itemsTable td input { border: none; width: 100%; font-family: inherit; background: transparent; padding: 0; }
  #itemsTable td input:focus { outline: none; }
  .row-amount, .totals span { font-variant-numeric: tabular-nums; }

  col.c-sl { width: 5%; } col.c-particulars { width: 27%; } col.c-grade { width: 12%; }
  col.c-vch { width: 10%; } col.c-qty { width: 12%; } col.c-rate { width: 13%; } col.c-amount { width: 21%; }

  button.add-row { margin-top: 0.8rem; padding: 0.5rem 1rem; font-size: 0.85rem; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; cursor: pointer; }
  button.add-row:hover { background: var(--concrete); }
  button.remove-row { padding: 0.2rem 0.55rem; font-size: 0.75rem; border: 1px solid var(--rust); color: var(--rust); background: var(--rust-bg); border-radius: 6px; cursor: pointer; }

  .totals { margin-top: 1.2rem; text-align: right; font-size: 1rem; }
  .totals .grand { font-weight: 700; font-size: 1.25rem; border-top: 2px solid #000; padding-top: 0.5rem; margin-top: 0.4rem; font-family: 'Space Grotesk', sans-serif; color: var(--navy); }
</style>
</head>
<body>
<script src="/auth-nav.js"></script>

<div class="shell">
  <aside class="sidebar">

        <div class="brand-name">Aaral Marketing</div>
        <div class="brand-sub">Ledger &amp; billing</div>
      </div>
    </a>

    <a class="nav-item" href="/dashboard.html">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 10 4l7 6.5"/><path d="M5 9v7a1 1 0 0 0 1 1h3v-5h2v5h3a1 1 0 0 0 1-1V9"/></svg>
      <span>Home</span>
    </a>
    <a class="nav-item" href="/customers.html">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="3"/><circle cx="14.5" cy="8.2" r="2.3"/><path d="M2.3 17c.5-3.1 2.3-4.7 4.7-4.7s4.2 1.6 4.7 4.7"/><path d="M12.6 13.1c1.7.2 3 1.7 3.4 3.9"/></svg>
      <span>Customers</span>
    </a>
    <a class="nav-item" href="/quotation.html">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h6l3 3V17a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1Z"/><path d="M12 2.5V6h3"/><path d="M7 10h6M7 13h6M7 7h3"/></svg>
      <span>New Quotation</span>
    </a>
    <a class="nav-item" href="/chitti.html">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5h10v15l-1.5-1-1.5 1-1.5-1-1.5 1-1.5-1-1.5 1-1.5-1z"/><path d="M7.5 6.5h5M7.5 9.5h5M7.5 12.5h3"/></svg>
      <span>New Slip</span>
    </a>
    <a class="nav-item" href="/payment.html">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="15" height="10.5" rx="2"/><path d="M2.5 8.5h15"/><circle cx="14.5" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
      <span>New Payment</span>
    </a>

    <div class="nav-divider"></div>
    <div class="nav-section-label">Iron &amp; Steel</div>
    <a class="nav-item" href="/steel-chitti.html">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5h10v15l-1.5-1-1.5 1-1.5-1-1.5 1-1.5-1-1.5 1-1.5-1z"/><path d="M7.5 6.5h5M7.5 9.5h5M7.5 12.5h3"/></svg>
      <span>Steel Chitti</span>
    </a>
    <a class="nav-item" href="/steel-stock.html">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5 17 6.2v7.6L10 17.5 3 13.8V6.2z"/><path d="M3 6.2 10 10l7-3.8M10 10v7.5"/></svg>
      <span>Steel Stock</span>
    </a>
    <a class="nav-item" href="/steel-reports.html">
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 17V9M9.5 17V3M15.5 17v-6"/><path d="M2.5 17h15"/></svg>
      <span>Steel Reports</span>
    </a>

    <div class="nav-divider" data-admin-only></div>
    <div class="nav-section-label" data-admin-only>Admin</div>
    <a class="nav-item" href="/updates.html" data-admin-only>
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a6 6 0 0 1 10.2-4.3M16 10a6 6 0 0 1-10.2 4.3"/><path d="M14.2 5.7H17V3"/><path d="M5.8 14.3H3V17"/></svg>
      <span>Updates</span>
    </a>
    <a class="nav-item" href="/users.html" data-admin-only>
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5 16 5v5c0 4-2.7 6.5-6 7.5-3.3-1-6-3.5-6-7.5V5z"/><path d="M7.3 9.8l1.9 1.9 3.5-3.9"/></svg>
      <span>Users</span>
    </a>
    <a class="nav-item" href="/personnel-tracking.html" data-admin-only>
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h7a1 1 0 0 1 1 1V16a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"/><path d="M7.5 3h5v1.6h-5z"/><path d="M7 8h6M7 11h6M7 14h3.5"/></svg>
      <span>Personnel Tracking</span>
    </a>

    <a class="nav-item" href="/backup.html" data-admin-only>
      <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5v10.5M6.5 9.5 10 13l3.5-3.5"/><path d="M4 13.5v2A1.5 1.5 0 0 0 5.5 17h9a1.5 1.5 0 0 0 1.5-1.5v-2"/></svg>
      <span>Backup</span>
    </a>

    <div class="profile-card" id="profileCard" style="display:none;">
      <div class="profile-avatar" id="profileAvatar">--</div>
      <div class="profile-meta">
        <div class="profile-name" id="profileName">—</div>
        <div class="profile-role" id="profileRole">—</div>
      </div>
      <button class="profile-logout" id="navLogoutBtn" type="button" title="Log out">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h4"/><path d="M13 14l4-4-4-4"/><path d="M17 10H7"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="content-inner">
      <a class="back-link" href="/customers.html" id="backLink">&larr; Back to ledger</a>

      <div class="topbar" style="margin-bottom:14px;">
        <div>
          <div class="page-eyebrow">Sales voucher</div>
          <h1 class="page-title" id="pageTitle">Edit Invoice</h1>
        </div>
      </div>

      <div class="card form-card">
        <div class="field-group">
          <label>Destination</label>
          <input type="text" id="destination" placeholder="e.g. site / delivery location" autocomplete="off">
        </div>

        <div class="field-group">
          <label>Note</label>
          <input type="text" id="note" placeholder="e.g. special instructions" autocomplete="off">
        </div>

        <table id="itemsTable">
          <colgroup>
            <col class="c-sl"><col class="c-particulars"><col class="c-grade"><col class="c-vch">
            <col class="c-qty"><col class="c-rate"><col class="c-amount">
          </colgroup>
          <thead>
            <tr><th>Sl</th><th>Particulars</th><th>Grade</th><th>Vch</th><th>Qty</th><th>Rate</th><th>Amount</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
        <button id="addRow" class="add-row" type="button">+ Add line</button>

        <div class="totals">
          <div>Subtotal: ₹<span id="subtotal">0.00</span></div>
          <div>
            <label style="display:inline;">Hamali Charges: ₹</label>
            <input id="unloading" type="number" min="0" step="0.01" style="width:100px;display:inline;">
          </div>
          <div>
            <label style="display:inline;">Freight Charges: ₹</label>
            <input id="freight" type="number" min="0" step="0.01" style="width:100px;display:inline;">
          </div>
          <div class="grand">Total: ₹<span id="grandTotal">0.00</span></div>
        </div>

        <button id="saveBtn" class="btn-primary" type="button" style="margin-top:1.2rem;">Save Changes</button>
        <div id="status" style="margin-top:0.6rem;font-size:0.9rem;"></div>
      </div>
    </div>
  </main>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const invoiceId = params.get('id');
const tbody = document.querySelector('#itemsTable tbody');
const statusEl = document.getElementById('status');

function addRow(item) {
  const tr = document.createElement('tr');
  const sNo = tbody.children.length + 1;
  tr.innerHTML = `
    <td class="sl-cell">${sNo}</td>
    <td><input class="particulars" value="${item ? (item.particulars || '').replace(/"/g, '&quot;') : ''}"></td>
    <td><input class="grade" value="${item ? (item.grade || '').replace(/"/g, '&quot;') : ''}"></td>
    <td><input class="vch" value="${item ? (item.vch || '').replace(/"/g, '&quot;') : ''}"></td>
    <td><input class="qty" type="number" min="0" step="0.01" value="${item ? Number(item.qty) : ''}"></td>
    <td><input class="rate" type="number" min="0" step="0.01" value="${item ? Number(item.rate) : ''}"></td>
    <td class="row-amount">${item ? formatMoney(Number(item.amount)) : '0.00'}</td>
    <td><button class="remove-row" type="button">&times;</button></td>`;
  tbody.appendChild(tr);
  tr.querySelectorAll('.qty, .rate').forEach((el) => el.addEventListener('input', recalc));
  tr.querySelector('.remove-row').addEventListener('click', () => { tr.remove(); renumber(); recalc(); });
}

function renumber() {
  [...tbody.querySelectorAll('tr')].forEach((tr, i) => { tr.querySelector('.sl-cell').textContent = i + 1; });
}

function formatMoney(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(2);
}

function recalc() {
  let subtotal = 0;
  tbody.querySelectorAll('tr').forEach((tr) => {
    const qty = Number(tr.querySelector('.qty').value) || 0;
    const rate = Number(tr.querySelector('.rate').value) || 0;
    const amount = qty * rate;
    tr.querySelector('.row-amount').textContent = formatMoney(amount);
    subtotal += amount;
  });
  const unloading = Number(document.getElementById('unloading').value) || 0;
  const freight = Number(document.getElementById('freight').value) || 0;
  document.getElementById('subtotal').textContent = formatMoney(subtotal);
  document.getElementById('grandTotal').textContent = formatMoney(subtotal + unloading + freight);
}

document.getElementById('addRow').addEventListener('click', () => { addRow(null); recalc(); });
document.getElementById('unloading').addEventListener('input', recalc);
document.getElementById('freight').addEventListener('input', recalc);

async function load() {
  const res = await fetch(`/api/invoices/${invoiceId}`);
  if (!res.ok) {
    statusEl.textContent = 'Invoice not found.';
    statusEl.style.color = 'var(--rust)';
    return;
  }
  const { invoice, items } = await res.json();
  if (invoice.voided_at) {
    statusEl.textContent = 'This invoice is voided and cannot be edited.';
    statusEl.style.color = 'var(--rust)';
    document.getElementById('saveBtn').disabled = true;
  }
  document.getElementById('pageTitle').textContent = `Edit Invoice #${invoice.invoice_number}`;
  document.getElementById('destination').value = invoice.destination || '';
  document.getElementById('note').value = invoice.note || '';
  document.getElementById('unloading').value = invoice.unloading_charge || '';
  document.getElementById('freight').value = invoice.freight_charge || '';
  if (invoice.customer_id) document.getElementById('backLink').href = `/customer.html?id=${invoice.customer_id}`;
  items.forEach((item) => addRow(item));
  recalc();
}
load();

document.getElementById('saveBtn').addEventListener('click', async () => {
  const items = [...tbody.querySelectorAll('tr')]
    .map((tr) => ({
      particulars: tr.querySelector('.particulars').value,
      grade: tr.querySelector('.grade').value,
      vch: tr.querySelector('.vch').value,
      qty: tr.querySelector('.qty').value,
      rate: tr.querySelector('.rate').value,
    }))
    .filter((item) => item.particulars.trim() || item.qty || item.rate);
  const body = {
    items,
    unloadingCharge: document.getElementById('unloading').value || null,
    freightCharge: document.getElementById('freight').value || null,
    note: document.getElementById('note').value.trim() || null,
    destination: document.getElementById('destination').value.trim() || null,
    invoiceDate: null,
  };
  const res = await fetch(`/api/invoices/${invoiceId}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!data.ok) {
    statusEl.textContent = `Error: ${data.error}`;
    statusEl.style.color = 'var(--rust)';
    return;
  }
  statusEl.textContent = 'Saved. Redirecting…';
  statusEl.style.color = 'var(--moss)';
  setTimeout(() => {
    window.location.href = data.invoice.customer_id ? `/customer.html?id=${data.invoice.customer_id}` : '/';
  }, 600);
});
</script>
<script>
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
