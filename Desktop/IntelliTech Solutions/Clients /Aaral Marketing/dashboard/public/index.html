<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Aaral Marketing</title>
<link rel="icon" href="/assets/aaral-logo-small.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aaral Marketing">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#191048">
<link rel="apple-touch-icon" href="/assets/aaral-icon-180.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="cement-page">

<div class="cement-header">
  <a class="brand-row" href="/">
    <div class="brand-icon-wrap"><img src="/assets/aaral-icon-180.png" alt="Aaral Marketing"></div>
    <div>
      <div class="brand-name">Aaral Marketing</div>
      <div class="brand-sub">Ledger &amp; billing</div>
    </div>
  </a>
  <a class="btn-primary" href="/dashboard.html">Enter Dashboard →</a>
</div>

<div class="cement-hero">
  <img src="/assets/cement/hero.jpg" alt="Concrete being poured on site">
  <div class="cement-hero-inner">
    <div class="cement-hero-eyebrow" id="todayLabel">Today</div>
    <h1 class="cement-hero-title">Built on cement, run on trust.</h1>
  </div>
</div>

<div class="cement-grid">
  <div class="panel">
    <div class="panel-header">Cement industry news</div>
    <div class="news-list" id="newsList">
      <div class="empty-state">Loading…</div>
    </div>
  </div>

  <div>
    <div class="panel" style="margin-bottom: 18px;">
      <div class="panel-header">Cement stocks — NSE</div>
      <div class="ticker-grid" id="tickerGrid">
        <div class="empty-state">Loading…</div>
      </div>
    </div>
    <div class="panel fact-panel">
      <div class="fact-badge">Did you know</div>
      <p class="fact-text" id="factText">&nbsp;</p>
    </div>
  </div>
</div>

<div class="cement-gallery">
  <img src="/assets/cement/plant.jpg" alt="Cement factory">
  <img src="/assets/cement/mixer.jpg" alt="Concrete mixer truck">
  <img src="/assets/cement/site.jpg" alt="Construction site">
</div>

<div class="footer-credit">Powered by IntelliTech Solutions</div>

<script>
document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });

const FACTS = [
  'Water aside, concrete is the most-used man-made material on Earth by volume — more than steel, plastic and aluminium put together.',
  'Ancient Roman concrete used volcanic ash and has outlasted much of what we build today — some structures are still standing 2,000 years later.',
  'India is the second-largest cement producer in the world, after China.',
  'Cement itself isn’t concrete — cement is the glue; mixed with sand, gravel and water, it becomes concrete.',
  '"Portland cement" is named after the Isle of Portland in England, whose stone it resembled once hardened.',
  'A single tonne of cement production releases roughly 0.6–0.9 tonnes of CO₂, making the industry a major target for decarbonisation.',
  'Concrete gets stronger for years — it never really stops curing, just slows down dramatically after about 28 days.',
  'The Hoover Dam’s concrete is still curing internally, more than 90 years after it was poured.',
  'China has poured more concrete in the last decade than the US did in the entire 20th century.',
  'Adding too much water to a cement mix is the single biggest cause of weak concrete — it dilutes the strength-giving reaction.',
  'Fly ash and slag, waste products from power plants and steel mills, are often blended into cement to cut both cost and emissions.',
  'The Pantheon in Rome, poured in 128 AD, is still the world’s largest unreinforced concrete dome.',
  'Cement sets through a chemical reaction with water called hydration, not by drying out — it can even cure underwater.',
  'Ready-mix concrete trucks keep rotating during transit for one reason only: to stop the mix from setting before it arrives.',
  'UltraTech Cement, headquartered in Mumbai, is India’s largest cement producer and among the top players worldwide.',
];
document.getElementById('factText').textContent = FACTS[Math.floor(Math.random() * FACTS.length)];

function fmtPrice(n) {
  return new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2 }).format(n);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

async function loadStocks() {
  const el = document.getElementById('tickerGrid');
  try {
    const res = await fetch('/api/cement/stocks');
    const data = await res.json();
    if (!data.ok || !data.stocks.length) throw new Error('empty');
    el.innerHTML = data.stocks.map((s) => {
      const up = s.change >= 0;
      const arrow = up ? '▲' : '▼';
      return `<div class="ticker-card">
        <div class="ticker-name">${s.name}</div>
        <div class="ticker-price">₹${fmtPrice(s.price)}</div>
        <div class="ticker-change ${up ? 'up' : 'down'}">${arrow} ${fmtPrice(Math.abs(s.change))} (${fmtPrice(Math.abs(s.changePct))}%)</div>
      </div>`;
    }).join('');
  } catch (err) {
    el.innerHTML = '<div class="empty-state">Stock data unavailable right now.</div>';
    console.error('Failed to load stocks', err);
  }
}

async function loadNews() {
  const el = document.getElementById('newsList');
  try {
    const res = await fetch('/api/cement/news');
    const data = await res.json();
    if (!data.ok || !data.items.length) throw new Error('empty');
    el.innerHTML = data.items.map((item) => {
      const when = item.publishedAt ? new Date(item.publishedAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '';
      return `<a class="news-item" href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer">
        <div class="news-title">${escapeHtml(item.title)}</div>
        <div class="news-meta">${escapeHtml(item.source)}${item.source && when ? ' · ' : ''}${when}</div>
      </a>`;
    }).join('');
  } catch (err) {
    el.innerHTML = '<div class="empty-state">News unavailable right now.</div>';
    console.error('Failed to load news', err);
  }
}

loadStocks();
loadNews();
</script>
</body>
</html>
